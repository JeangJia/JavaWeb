<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单的注册页面</title>
  <style>
    /* 基础重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      /* 按照要求设置背景色 */
      background-color: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 注册卡片容器 */
    .register-container {
      background-color: #ffffff;
      padding: 35px 30px;
      border-radius: 12px;
      /* 为了在浅色背景上区分，加一点淡淡的阴影 */
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
    }

    .register-container h2 {
      text-align: center;
      color: #333333;
      margin-bottom: 25px;
      font-size: 24px;
    }

    /* 输入框组 */
    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #555555;
      font-size: 14px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #dddddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background-color: #fafafa;
      transition: all 0.3s ease;
    }

    /* 输入框聚焦时的效果 */
    .input-group input:focus {
      background-color: #ffffff;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    /* 注册按钮 */
    .register-btn {
      width: 100%;
      padding: 12px;
      background-color: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }

    .register-btn:hover {
      background-color: #5a6fd6;
    }

    /* 底部链接 */
    .extra-links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #777777;
    }

    .extra-links a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="register-container">
  <h2>创建账号</h2>

  <form action="#" method="POST">
    <div class="input-group">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" placeholder="请输入用户名" required>
    </div>

    <div class="input-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="设置密码（至少6位）" minlength="6" required>
    </div>

    <div class="input-group">
      <label for="confirm-password">确认密码</label>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="请再次输入密码" minlength="6" required>
    </div>

    <button type="submit" class="register-btn">注 册</button>
  </form>

  <div class="extra-links">
    已有账号？ <a href="login.html">去登录</a>
  </div>
</div>

</body>
</html>
