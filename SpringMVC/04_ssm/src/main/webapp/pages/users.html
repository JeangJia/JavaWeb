<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户数据</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container">
    <h1>用户管理</h1>
    <div class="nav"><a href="index.html">返回首页</a></div>

    <div id="message"></div>

    <div class="form-row">
        <input type="text" id="newUsername" placeholder="用户名">
        <input type="text" id="newPassword" placeholder="密码">
        <button type="button" onclick="saveUser()">新增</button>
    </div>

    <div class="form-row">
        <input type="hidden" id="editId">
        <input type="text" id="editUsername" placeholder="修改用户名">
        <input type="text" id="editPassword" placeholder="修改密码">
        <button type="button" onclick="updateUser()">保存修改</button>
    </div>

    <table>
        <thead>
        <tr>
            <th>id</th>
            <th>username</th>
            <th>password</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="userRows"></tbody>
    </table>
</div>
<script src="../js/users.js"></script>
</body>
</html>
